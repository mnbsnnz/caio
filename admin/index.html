<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CIAO UNI · Admin</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#382b30;background:#faf7f2}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;background:#782d48;color:white;border:0;border-radius:9px;padding:11px 16px}button:disabled{opacity:.5}button.secondary{background:#f1e8e3;color:#382b30}button.danger{background:#a32343}input,select{width:100%;padding:12px;border:1px solid #d9ccc9;border-radius:9px;margin:7px 0 13px;background:#fff}label{display:block;font-size:14px}.login{max-width:430px;margin:12vh auto;padding:35px;background:white;border:1px solid #eadfda;border-radius:16px}h1{font-family:Georgia,serif;font-size:32px;margin:0 0 12px}.muted{color:#80757a}.error{color:#b12440;white-space:pre-wrap}.success{color:#216c4a;white-space:pre-wrap}#app{display:none}.layout{display:flex;min-height:100vh}aside{width:220px;background:#f1e8e3;padding:26px;flex-shrink:0}aside button{display:block;width:100%;margin:9px 0;text-align:left;background:transparent;color:#432b35}aside button.active{background:#782d48;color:white}main{padding:32px;flex:1;min-width:0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.stat,.panel{background:white;border:1px solid #e9ded9;border-radius:12px;padding:20px}.stat strong{display:block;font-size:25px;margin-top:10px}.panel{margin-top:20px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid #eee;padding:12px;vertical-align:middle}th{color:#76666d}.bar,.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.toolbar{margin:18px 0}.toolbar input{max-width:340px;margin:0}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:7px 10px;font-size:13px}#menu{display:none}dialog{border:1px solid #e9ded9;border-radius:16px;padding:26px;width:min(500px,calc(100% - 24px));box-shadow:0 16px 60px #0002}dialog::backdrop{background:#0006}.dialog-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}.hint{font-size:13px;color:#80757a}.nowrap{white-space:nowrap}@media(max-width:700px){aside{display:none;position:fixed;z-index:5;height:100vh;top:0;left:0;overflow:auto;box-shadow:0 5px 30px #0002}aside.open{display:block}main{padding:18px}#menu{display:inline-block}.login{margin:10vh 15px}}
</style></head><body>
<section id="login" class="login"><h1>CIAO UNI · Admin</h1><p class="muted">Вход администратора</p><form id="loginForm"><label for="password">Пароль</label><input id="password" type="password" required autocomplete="current-password"><button id="loginBtn" type="submit">Войти</button></form><p class="error" id="loginError" role="alert"></p></section>
<div id="app" class="layout"><aside id="sidebar"><h2>CIAO UNI</h2><p class="muted">ADMIN</p><button data-tab="overview" class="active">Обзор</button><button data-tab="students">Участники</button><button data-tab="payments">Платежи</button><button data-tab="expenses">Расходы</button><button data-tab="refunds">Возвраты</button><button id="logout">Выйти</button></aside><main><div class="bar"><div><button id="menu" class="secondary" aria-label="Меню">☰</button><h1 id="heading">Обзор</h1></div><button id="reload">Обновить</button></div><p id="status" class="muted" role="status"></p><div id="content"></div></main></div>
<dialog id="studentDialog"><form id="studentForm"><h2 id="dialogTitle">Добавить участника</h2><input id="studentId" type="hidden"><label>ФИО<input id="fullName" required maxlength="200"></label><label>Телефон<input id="phone" required placeholder="+7 777 123 45 67" maxlength="40"></label><label>Дата начала доступа<input id="accessStart" type="date" required></label><label>Дата окончания доступа<input id="accessEnd" type="date" required></label><label>Статус<select id="studentStatus"><option value="active">Активен</option><option value="blocked">Заблокирован</option></select></label><p class="hint">Доступ по умолчанию на 18 месяцев. Даты можно изменить вручную. Добавление записи не создаёт аккаунт для входа студента.</p><p id="studentError" class="error" role="alert"></p><div class="dialog-actions"><button type="button" class="secondary" id="cancelStudent">Отмена</button><button id="saveStudent" type="submit">Сохранить</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';
const SUPABASE_URL='https://hiysneqyaclenaosirqu.supabase.co';
const SUPABASE_KEY='sb_publishable_9-u0n4p6rbrOHrMlPBpP5A_ERrlwF5w';
const ADMIN_EMAIL='naz26030224@gmail.com';
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(n)||0)+' ₸';
const dt=s=>s?new Date(s).toLocaleString('ru-RU',{timeZone:'Asia/Almaty'}):'—';
const dateOnly=s=>s?String(s).slice(0,10):'—';
const localDate=s=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Almaty',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(s));
const plusMonths=(str,n)=>{let [y,m,d]=str.split('-').map(Number);let t=new Date(Date.UTC(y,m-1+n,1));let last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();return `${t.getUTCFullYear()}-${String(t.getUTCMonth()+1).padStart(2,'0')}-${String(Math.min(d,last)).padStart(2,'0')}`};
const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);let tab='overview';let cachedStudents=[];
async function requireAdmin(){const {data:{user},error}=await db.auth.getUser();if(error||!user)return {ok:false,message:error?.message||'Нет активной сессии'};const r=await db.from('user_roles').select('role').eq('user_id',user.id).maybeSingle();if(r.error)return {ok:false,message:'Не удалось прочитать роль admin: '+r.error.message};if(r.data?.role!=='admin')return {ok:false,message:'У аккаунта нет роли admin'};return {ok:true}}
async function init(){const a=await requireAdmin();if(a.ok){el('login').style.display='none';el('app').style.display='flex';await load()}else{el('login').style.display='block';el('app').style.display='none';if(a.message!=='Нет активной сессии')el('loginError').textContent=a.message}}
el('loginForm').onsubmit=async e=>{e.preventDefault();el('loginError').textContent='';el('loginBtn').disabled=true;try{if(!db)throw Error('Не загрузилась библиотека Supabase. Проверь интернет.');const {error}=await db.auth.signInWithPassword({email:ADMIN_EMAIL,password:el('password').value});if(error)throw error;const a=await requireAdmin();if(!a.ok)throw Error(a.message);el('password').value='';await init()}catch(e){el('loginError').textContent=e.message}finally{el('loginBtn').disabled=false}};
el('logout').onclick=async()=>{await db.auth.signOut();el('loginError').textContent='';await init()};el('reload').onclick=()=>load();el('menu').onclick=()=>el('sidebar').classList.toggle('open');
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));el('sidebar').classList.remove('open');load()});
async function fetchRows(name){let rows=[],from=0;while(true){const r=await db.from(name).select('*').range(from,from+999);if(r.error)throw Error(name+': '+r.error.message);rows.push(...(r.data||[]));if(!r.data||r.data.length<1000)break;from+=1000;if(from>=100000)throw Error(name+': превышен лимит 100 000 записей. Нужна серверная пагинация.')}return rows}
function table(rows,cols,actions=false){return '<div class="panel"><table><thead><tr>'+cols.map(c=>'<th>'+esc(c[1])+'</th>').join('')+(actions?'<th>Действия</th>':'')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(c[2]?c[2](r[c[0]],r):r[c[0]]??'—')+'</td>').join('')+(actions?'<td><div class="actions"><button class="secondary" data-edit="'+esc(r.id)+'">Изменить</button><button class="secondary" data-toggle="'+esc(r.id)+'">'+(r.status==='blocked'?'Разблокировать':'Блокировать')+'</button><button class="danger" data-delete="'+esc(r.id)+'">Удалить</button></div></td>':'')+'</tr>').join('')+'</tbody></table>'+(rows.length?'':'<p class="muted">Нет записей</p>')+'</div>'}
function studentList(rows){return table(rows,[['full_name','ФИО'],['phone','Телефон'],['status','Статус'],['registered_at','Регистрация',dt],['access_start','Начало доступа',dateOnly],['access_end','Конец доступа',dateOnly]],true)}
function renderStudents(){const q=el('searchStudents')?.value.trim().toLowerCase()||'';const rows=cachedStudents.filter(x=>[x.full_name,x.phone].some(v=>String(v||'').toLowerCase().includes(q)));el('studentsTable').innerHTML=studentList(rows)}
async function load(){el('status').textContent='Загрузка данных...';el('content').innerHTML='';const titles={overview:'Обзор',students:'Участники',payments:'Платежи',expenses:'Расходы',refunds:'Возвраты'};el('heading').textContent=titles[tab];try{if(tab==='overview'){const [s,p,e,r]=await Promise.all(['students','payments','expenses','refunds'].map(fetchRows));const now=new Date(),today=localDate(now),month=today.slice(0,7),paid=p.filter(x=>['paid','refunded'].includes(x.status)&&x.paid_at),total=xs=>xs.reduce((a,x)=>a+Number(x.amount||0),0);const active=s.filter(x=>x.status==='active'&&x.access_start&&new Date(x.access_start)<=now&&x.access_end&&new Date(x.access_end)>now);const cards=[['Всего участников',s.length],['Активный доступ',active.length],['Платежи сегодня',fmt(total(paid.filter(x=>localDate(x.paid_at)===today)))],['Платежи за месяц',fmt(total(paid.filter(x=>localDate(x.paid_at).slice(0,7)===month)))],['Платежи за всё время',fmt(total(paid))],['Возвраты за всё время',fmt(total(r))],['Расходы за всё время',fmt(total(e))],['Денежный результат',fmt(total(paid)-total(r)-total(e))]];const months={};paid.forEach(x=>{const k=localDate(x.paid_at).slice(0,7);months[k]=(months[k]||0)+Number(x.amount||0)});el('content').innerHTML='<div class="stats">'+cards.map(([k,v])=>'<div class="stat">'+esc(k)+'<strong>'+esc(v)+'</strong></div>').join('')+'</div><h2>Поступления по месяцам</h2>'+table(Object.entries(months).sort((a,b)=>b[0].localeCompare(a[0])).map(([month,amount])=>({month,amount})),[['month','Месяц'],['amount','Поступления',fmt]])+'<p class="hint">Показатели рассчитаны из записанных операций, не являются налоговой прибылью. Для полноценной бухгалтерии нужна отдельная сверка платежей и комиссий.</p>'}
else if(tab==='students'){cachedStudents=await fetchRows('students');el('content').innerHTML='<div class="toolbar"><input id="searchStudents" placeholder="Поиск по имени или телефону" aria-label="Поиск участников"><button id="addStudent">+ Добавить участника</button></div><div id="studentsTable"></div><p class="hint">Удаление удаляет запись из students, но не аккаунт Supabase Auth. Блокировка доступа должна также проверяться в личном кабинете студента на стороне базы.</p>';el('searchStudents').oninput=renderStudents;el('addStudent').onclick=()=>openStudent();renderStudents()}
else{const rows=await fetchRows(tab);const cols={payments:[['student_id','ID студента'],['amount','Сумма',fmt],['status','Статус'],['payment_method','Способ'],['paid_at','Дата оплаты',dt]],expenses:[['category','Категория'],['amount','Сумма',fmt],['expense_date','Дата'],['description','Описание']],refunds:[['payment_id','ID платежа'],['amount','Сумма',fmt],['refunded_at','Дата',dt],['reason','Причина']]};el('content').innerHTML=table(rows,cols[tab])+'<p class="hint">Сейчас просмотр операций. Редактирование финансов добавим после проверки схемы и правил учёта.</p>'}el('status').textContent='Данные загружены из Supabase'}catch(e){el('status').textContent='Ошибка загрузки';el('content').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
function openStudent(id){el('studentForm').reset();el('studentError').textContent='';let s=cachedStudents.find(x=>x.id===id);el('studentId').value=s?.id||'';el('dialogTitle').textContent=s?'Изменить участника':'Добавить участника';el('fullName').value=s?.full_name||'';el('phone').value=s?.phone||'';el('studentStatus').value=s?.status||'active';el('accessStart').value=dateOnly(s?.access_start)==='—'?localDate(new Date()):dateOnly(s.access_start);el('accessEnd').value=s?.access_end?dateOnly(s.access_end):plusMonths(el('accessStart').value,18);el('studentDialog').showModal()}
el('accessStart').addEventListener('change',()=>{if(!el('studentId').value&&el('accessStart').value)el('accessEnd').value=plusMonths(el('accessStart').value,18)});el('cancelStudent').onclick=()=>el('studentDialog').close();
el('studentForm').onsubmit=async e=>{e.preventDefault();el('studentError').textContent='';const id=el('studentId').value;const payload={full_name:el('fullName').value.trim(),phone:el('phone').value.trim(),status:el('studentStatus').value,access_start:el('accessStart').value,access_end:el('accessEnd').value};if(!payload.full_name||!payload.phone)return el('studentError').textContent='Заполни ФИО и телефон';if(payload.access_end<=payload.access_start)return el('studentError').textContent='Дата окончания должна быть позже даты начала';el('saveStudent').disabled=true;try{const r=id?await db.from('students').update(payload).eq('id',id).select('id'):await db.from('students').insert(payload).select('id');if(r.error)throw r.error;if(!r.data?.length)throw Error('Изменение не подтверждено. Проверь RLS и права таблицы students.');el('studentDialog').close();await load()}catch(e){el('studentError').textContent=e.message}finally{el('saveStudent').disabled=false}};
el('content').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||tab!=='students')return;if(b.dataset.edit){openStudent(b.dataset.edit);return}const id=b.dataset.toggle||b.dataset.delete;if(!id)return;const s=cachedStudents.find(x=>x.id===id);if(!s)return;if(b.dataset.toggle){const next=s.status==='blocked'?'active':'blocked';if(!confirm(`${next==='blocked'?'Заблокировать':'Разблокировать'} участника ${s.full_name}?`))return;const r=await db.from('students').update({status:next}).eq('id',id).select('id');if(r.error||!r.data?.length){alert(r.error?.message||'Изменение не подтверждено');return}await load()}else{if(!confirm(`Удалить запись участника ${s.full_name}? Это действие нельзя отменить.`))return;const r=await db.from('students').delete().eq('id',id).select('id');if(r.error||!r.data?.length){alert(r.error?.message||'Удаление не подтверждено. Возможно, есть связанные платежи.');return}await load()}});
if(db)init();else el('loginError').textContent='Не загрузилась библиотека Supabase.';
</script></body></html>
