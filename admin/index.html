<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CIAO UNI · Admin</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#382b30;background:#faf7f2}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;background:#782d48;color:#fff;border:0;border-radius:9px;padding:12px 18px}button:disabled{opacity:.5}input{width:100%;padding:13px;border:1px solid #d9ccc9;border-radius:9px;margin:9px 0 14px}.login{max-width:430px;margin:12vh auto;padding:35px;background:#fff;border:1px solid #eadfda;border-radius:16px}h1{font-family:Georgia,serif;font-size:32px}.muted{color:#80757a}#app{display:none}.layout{display:flex;min-height:100vh}aside{width:220px;background:#f1e8e3;padding:26px;flex-shrink:0}aside button{display:block;width:100%;margin:9px 0;text-align:left;background:transparent;color:#432b35}aside button.active{background:#782d48;color:#fff}main{padding:32px;flex:1;min-width:0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.stat,.panel{background:#fff;border:1px solid #e9ded9;border-radius:12px;padding:20px}.stat strong{display:block;font-size:25px;margin-top:10px}.panel{margin-top:20px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid #eee;padding:12px}th{color:#76666d}.error{color:#b12440;white-space:pre-wrap}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}#menu{display:none}@media(max-width:700px){aside{display:none;position:absolute;z-index:2;height:100%;box-shadow:0 5px 30px #0002}aside.open{display:block}main{padding:18px}#menu{display:inline-block}.login{margin:10vh 15px}}
</style></head><body>
<section id="login" class="login"><h1>CIAO UNI · Admin</h1><p class="muted">Вход администратора</p><form id="loginForm"><label for="password">Пароль</label><input id="password" type="password" required autocomplete="current-password"><button id="loginBtn" type="submit">Войти</button></form><p class="error" id="loginError" role="alert"></p></section>
<div id="app" class="layout"><aside id="sidebar"><h2>CIAO UNI</h2><p class="muted">ADMIN</p><button data-tab="overview" class="active">Обзор</button><button data-tab="students">Участники</button><button data-tab="payments">Платежи</button><button data-tab="expenses">Расходы</button><button data-tab="refunds">Возвраты</button><button id="logout">Выйти</button></aside><main><div class="bar"><div><button id="menu">☰</button><h1 id="heading">Обзор</h1></div><button id="reload">Обновить</button></div><p id="status" class="muted"></p><div id="content"></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const PROJECT_URL='https://hiysneqyaclenaosirqu.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_9-u0n4p6rbrOHrMlPBpP5A_ERrlwF5w';
const ADMIN_EMAIL='naz26030224@gmail.com';
const el=id=>document.getElementById(id);
const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(n)||0)+' ₸';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>s?new Date(s).toLocaleString('ru-RU',{timeZone:'Asia/Almaty'}):'—';
let db,tab='overview';
function showLogin(message=''){el('login').style.display='block';el('app').style.display='none';el('loginError').textContent=message;}
function showApp(){el('login').style.display='none';el('app').style.display='flex';}
async function checkAdmin(){
  const {data,error}=await db.auth.getUser();
  if(error||!data?.user)return {ok:false,reason:'Сессия не найдена. Войди ещё раз.'};
  if(data.user.email?.toLowerCase()!==ADMIN_EMAIL.toLowerCase())return {ok:false,reason:'Это не аккаунт администратора.'};
  const r=await db.from('user_roles').select('role').eq('user_id',data.user.id).maybeSingle();
  if(r.error)return {ok:false,reason:'Не удалось прочитать роль admin: '+r.error.message+'. Проверь RLS для user_roles.'};
  if(r.data?.role!=='admin')return {ok:false,reason:'Сайт не видит роль admin. Проверь SELECT policy таблицы user_roles.'};
  return {ok:true};
}
async function init(){
  if(!db){showLogin('Не удалось подключить Supabase. Проверь подключение к интернету.');return;}
  try{const a=await checkAdmin();if(a.ok){showApp();await load();}else{showLogin();}}
  catch(e){showLogin('Ошибка проверки входа: '+e.message);}
}
try{
  if(!window.supabase)throw Error('Библиотека Supabase не загрузилась');
  db=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY);
}catch(e){showLogin('Ошибка подключения: '+e.message);}
el('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();if(!db)return showLogin('Supabase не подключён.');
  const btn=el('loginBtn');btn.disabled=true;el('loginError').textContent='Проверяем вход...';
  try{
    const {error}=await db.auth.signInWithPassword({email:ADMIN_EMAIL,password:el('password').value});
    if(error)throw Error('Supabase: '+error.message);
    const a=await checkAdmin();
    if(!a.ok)throw Error(a.reason);
    el('password').value='';showApp();await load();
  }catch(err){el('loginError').textContent=err.message+'\nПароль не был изменён на сайте. Если Supabase пишет Invalid login credentials, проверь пароль аккаунта в Supabase.';}
  finally{btn.disabled=false;}
});
el('logout').onclick=async()=>{await db?.auth.signOut();el('password').value='';showLogin();};
el('reload').onclick=()=>load();el('menu').onclick=()=>el('sidebar').classList.toggle('open');
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));el('sidebar').classList.remove('open');load();});
async function fetchRows(name){const r=await db.from(name).select('*').limit(1000);if(r.error)throw Error(name+': '+r.error.message);return r.data||[];}
function table(rows,cols){return '<div class="panel"><table><thead><tr>'+cols.map(c=>'<th>'+esc(c[1])+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(c[2]?c[2](r[c[0]],r):r[c[0]]??'—')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'+(rows.length?'':'<p class="muted">Нет записей</p>')+'</div>';}
async function load(){
  el('status').textContent='Загрузка данных...';el('content').innerHTML='';
  const titles={overview:'Обзор',students:'Участники',payments:'Платежи',expenses:'Расходы',refunds:'Возвраты'};el('heading').textContent=titles[tab];
  try{
    if(tab==='overview'){
      const [s,p,e,r]=await Promise.all(['students','payments','expenses','refunds'].map(fetchRows));
      const now=new Date();const key=v=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Almaty',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(v));
      const today=key(now),month=today.slice(0,7);const paid=p.filter(x=>['paid','refunded'].includes(x.status)&&x.paid_at);
      const total=xs=>xs.reduce((a,x)=>a+Number(x.amount||0),0);
      const active=s.filter(x=>x.status==='active'&&x.access_start&&new Date(x.access_start)<=now&&x.access_end&&new Date(x.access_end)>now);
      const cards=[['Всего участников',s.length],['Активный доступ',active.length],['Платежи сегодня',fmt(total(paid.filter(x=>key(x.paid_at)===today)))],['Платежи за месяц',fmt(total(paid.filter(x=>key(x.paid_at).slice(0,7)===month)))],['Платежи за всё время',fmt(total(paid))],['Возвраты за всё время',fmt(total(r))],['Расходы за всё время',fmt(total(e))],['Денежный результат',fmt(total(paid)-total(r)-total(e))]];
      const months={};paid.forEach(x=>{const k=key(x.paid_at).slice(0,7);months[k]=(months[k]||0)+Number(x.amount||0)});
      el('content').innerHTML='<div class="stats">'+cards.map(([k,v])=>'<div class="stat">'+esc(k)+'<strong>'+esc(v)+'</strong></div>').join('')+'</div><h2>Поступления по месяцам</h2>'+table(Object.entries(months).sort((a,b)=>b[0].localeCompare(a[0])).map(([month,amount])=>({month,amount})),[['month','Месяц'],['amount','Поступления',fmt]])+'<p class="muted">Показаны записанные операции, максимум 1000 на таблицу. Денежный результат не является налоговой прибылью.</p>';
    }else{
      const rows=await fetchRows(tab);
      const cols={students:[['full_name','ФИО'],['phone','Телефон'],['status','Статус'],['registered_at','Регистрация',date],['access_start','Начало доступа',date],['access_end','Конец доступа',date]],payments:[['student_id','ID студента'],['amount','Сумма',fmt],['status','Статус'],['payment_method','Способ'],['paid_at','Дата оплаты',date]],expenses:[['category','Категория'],['amount','Сумма',fmt],['expense_date','Дата'],['description','Описание']],refunds:[['payment_id','ID платежа'],['amount','Сумма',fmt],['refunded_at','Дата',date],['reason','Причина']]};
      el('content').innerHTML=table(rows,cols[tab])+'<p class="muted">Пока доступен просмотр записей.</p>';
    }
    el('status').textContent='Данные загружены из Supabase';
  }catch(e){el('status').textContent='Ошибка загрузки';el('content').innerHTML='<p class="error">'+esc(e.message)+'</p>';}
}
init();
</script></body></html>
